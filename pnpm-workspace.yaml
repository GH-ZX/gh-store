# Single-package app; this file holds pnpm project settings (pnpm 10+).
packages:
  - "."

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

minimumReleaseAgeExclude:
  - "@supabase/auth-js@2.110.9"
  - "@supabase/functions-js@2.110.9"
  - "@supabase/postgrest-js@2.110.9"
  - "@supabase/realtime-js@2.110.9"
  - "@supabase/storage-js@2.110.9"
  - "@supabase/supabase-js@2.110.9"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
